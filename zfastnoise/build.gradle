plugins {
  id 'zfast.common'
}

loom {
  accessWidenerPath = file("src/main/resources/zfastnoise.ct")
}

dependencies {
  include project(":zfastnoise-ocl")
  runtimeOnly project(path: ":zfastnoise-ocl", configuration: "namedElements")
}

zmodPublish {
  name = "Fast Noise"
  icon = "https://cdn.modrinth.com/data/OnlVIpq5/6f2393cd87c37ef685efb82aacc5b0c9fae0c28d.png"
  mrId = "OnlVIpq5"
  cfId = "1460602"
  cfSlug = "zfastnoise"
}

def zconfigSources = providers.provider {
  project(":zfastnoise-ocl").sourcesJar
}

publishMods {
  modrinth {
    additionalFile(zconfigSources) {
      type = SOURCES_JAR
    }

    incompatible("moonrise-opt")
    incompatible("anti-xray")
  }

  curseforge {
    additionalFile(zconfigSources) {
      name = "Sources Jar for Opencl integration"
    }

    incompatible("moonrise")
    incompatible("antixray")
    incompatible("antixray-forge")
  }
}
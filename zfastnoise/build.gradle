version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

loom {
  accessWidenerPath = file("src/main/resources/zfastnoise.ct")
}

dependencies {
  implementation project(path: ":zconfig", configuration: "namedElements")
  include project(":zfastnoise-ocl")
  runtimeOnly project(path: ":zfastnoise-ocl", configuration: "namedElements")
}

processResources {
  inputs.property "version", project.version
  inputs.property "zconfig_version", project(":zconfig").version

  filesMatching("fabric.mod.json") {
    expand(inputs.properties)
  }
}

publishMods {
  file = remapJar.archiveFile
  modLoaders.add("fabric")
  modLoaders.add("quilt")

  changelog = file("changelog.md").exists() ? file("changelog.md").getText() : ""
  def typeStr = project.hasProperty("zmtype") ? project.getProperty("zmtype") : "alpha"
  type = switch(typeStr) {
    case "stable" -> STABLE
    case "release" -> STABLE
    case "beta" -> BETA
    default -> ALPHA
  }

  displayName = "Fast Noise " + project.version

  discord {
    username = "Fast Noise"
    webhookUrl = providers.environmentVariable("DISCORD_WEBHOOK")
    dryRunWebhookUrl = providers.environmentVariable("DISCORD_WEBHOOK")
    avatarUrl = "https://cdn.modrinth.com/data/OnlVIpq5/6f2393cd87c37ef685efb82aacc5b0c9fae0c28d.png"

    content = "## " + displayName.get() + "\n" + changelog.get()
  }

  modrinth {
    accessToken = providers.environmentVariable("MODRINTH_TOKEN")
    projectId = "OnlVIpq5"

    minecraftVersionRange {
      start = project.min_minecraft_version
      end = project.max_minecraft_version

      includeSnapshots = true
    }

    announcementTitle = "Download from Modrinth"

    additionalFile(sourcesJar) {
      type = SOURCES_JAR
    }

    additionalFile(project(":zfastnoise-ocl").sourcesJar) {
      type = SOURCES_JAR
    }

    additionalFile(project(":zfastnoise-ocl").sourcesJar) {
      type = SOURCES_JAR
    }

    incompatible("moonrise-opt")
    incompatible("anti-xray")
    requires("zconfig")
  }

  curseforge {
    accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
    projectId = "1460602"
    
    minecraftVersionRange {
      start = project.cf_mc_version
      end = project.max_minecraft_version
    }

    announcementTitle = "Download from Curseforge"

    javaVersions.add(JavaVersion.VERSION_21)

    projectSlug = "zfastnoise"

    client = true
    server = true

    additionalFile(sourcesJar) {
      name = "Sources Jar"
    }

    additionalFile(project(":zfastnoise-ocl").sourcesJar) {
      name = "Sources Jar for Opencl integration"
    }

    incompatible("moonrise")
    incompatible("antixray")
    incompatible("antixray-forge")
    requires("zconfig")
  }

  dryRun = providers.environmentVariable("MODRINTH_TOKEN").getOrNull() == null
}
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url = "https://repo.codemc.io/repository/relativitymc/"
	}
}

loom {
    accessWidenerPath = file('src/main/resources/zfastnoise-test.ct')

    runs {
        server {
            server()
            def props = ["zperfbenchmark","zuseasync","zworldname","zbenchmode","zwarmuptime","zmeasuretime","zwarmups","zmeasures","zmod","zforks", "zthreads", "zparity", "zseed", "zworldradius", "zendcenter", "zworldcenter"]
            for (def prop in props) {
                if (project.hasProperty(prop)) {
                    property(prop, project.getProperty(prop))
                }
            }
            vmArgs "-Xmx3G"
            vmArgs "-XX:+UnlockDiagnosticVMOptions"
            if (project.hasProperty("zuseasync")) {
              vmArgs "-XX:+DebugNonSafepoints"
            }
        }
    }

	intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
	useIntermediateMappings = true
}

dependencies {
  // To change the versions see the gradle.properties file
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

  implementation project(path: ':', configuration: 'namedElements')
  implementation 'org.openjdk.jmh:jmh-core:1.37'
  annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

  include(implementation("com.electronwill.night-config:toml:${project.night_config_version}"))
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property 'loader_version', project.loader_version
    inputs.property 'minecraft_version', project.min_minecraft_version

    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
}

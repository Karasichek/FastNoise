version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

loom {
  accessWidenerPath = file('src/main/resources/zperf.ct')

  runs {
    server {
      server()
      def props = ["zperfbenchmark","zuseasync","zworldname","zbenchmode","zwarmuptime","zmeasuretime","zwarmups","zmeasures","zmod","zforks","zthreads","zparity","zseed","zworldradius","zendcenter","zworldcenter","zseedcount","zparityserver","zparityport"]
      for (def prop in props) {
        if (project.hasProperty(prop)) {
          property(prop, project.getProperty(prop))
        }
      }
      vmArgs "-Xmx3G"
      vmArgs "-XX:+UnlockDiagnosticVMOptions"
      if (project.hasProperty("zuseasync")) {
        vmArgs "-XX:+DebugNonSafepoints"
      }
    }
  }
}

dependencies {
  implementation 'org.openjdk.jmh:jmh-core:1.37'
  annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

  implementation project(path: ":zconfig", configuration: "namedElements")

  def loadMods = project.hasProperty("zmod") ? project.getProperty("zmod") == "true" : true

  if (loadMods) {
    implementation project(path: ":zfastnoise", configuration: "namedElements")
    implementation project(path: ":zfastsurface", configuration: "namedElements")
    implementation project(path: ":zmatcomp", configuration: "namedElements")
  }
}

processResources {
  inputs.property "version", project.version

  filesMatching("fabric.mod.json") {
    expand(inputs.properties)
  }
}
plugins {
  id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
  id 'maven-publish'
  id 'me.champeau.jmh' version "${jmh_version}"
  id "me.modmuss50.mod-publish-plugin" version "${mod_publish_plugin_version}"
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

repositories {
  // Add repositories to retrieve artifacts from in here.
  // You should only use this when depending on other mods because
  // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
  // See https://docs.gradle.org/current/userguide/declaring_repositories.html
  // for more information about repositories.
  mavenLocal()
}

loom {
  accessWidenerPath = file("src/main/resources/zfastnoise.ct")

  decompilerOptions.named("vineflower") {
    options.put("mark-corresponding-synthetics", "1")
  }

  runs {
    dap {
      vmArgs '-agentlib:jdwp=transport=dt_socket,server=y,address=5005'
      client()
    }

    hotswapDap {
      vmArgs '-agentlib:jdwp=transport=dt_socket,server=y,address=5005'
      vmArgs '-XX:+AllowEnhancedClassRedefinition'
      client()
    }
  }
}

test {
  useJUnitPlatform()
  workingDir = mkdir(layout.buildDirectory.dir("testrun"))
}

dependencies {
  // To change the versions see the gradle.properties file
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

  // Fabric API. This is technically optional, but you probably want it anyway.

  testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

  modImplementation "org.codeberg.zenxarch.zconfig:zconfig:1.0.0+1.21.x"
}

processResources {
  inputs.property "version", project.version
  inputs.property "loader_version", project.loader_version
  inputs.property "minecraft_version", project.min_minecraft_version

  filesMatching("fabric.mod.json") {
    expand(inputs.properties)
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 21
}

java {
  // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
  // if it is present.
  // If you remove this line, sources will not be generated.
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

jar {
  inputs.property "archivesName", project.base.archivesName

  from("LICENSE") {
    rename { "${it}_${inputs.properties.archivesName}"}
  }
}

// configure the maven publication
publishing {
  publications {
    create("mavenJava", MavenPublication) {
      artifactId = project.archives_base_name
      from components.java
    }
  }

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    // Add repositories to publish to here.
    // Notice: This block does NOT have the same function as the block in the top level.
    // The repositories here will be used for publishing your artifact, not for
    // retrieving dependencies.
  }
}

jmh {
  iterations = 4
  fork = 2
  timeOnIteration = '1s'

  // jvmArgsAppend = ["-XX:+UnlockDiagnosticVMOptions","-XX:+LogCompilation","-XX:+PrintAssembly"]

  warmup = '2s'
  warmupIterations = 2

  profilers = ['async']

  zip64 = true
}

publishMods {
  file = remapJar.archiveFile
  modLoaders.add("fabric")
  modLoaders.add("quilt")

  changelog = file("changelog.md").exists() ? file("changelog.md").getText() : ""
  def typeStr = project.hasProperty("zmtype") ? project.getProperty("zmtype") : "alpha"
  type = switch(typeStr) {
    case "stable" -> STABLE
    case "release" -> STABLE
    case "beta" -> BETA
    default -> ALPHA
  }

  displayName = "Fast Noise " + project.version

  discord {
    username = "Fast Noise"
    webhookUrl = providers.environmentVariable("DISCORD_WEBHOOK")
    dryRunWebhookUrl = providers.environmentVariable("DISCORD_WEBHOOK")
    avatarUrl = "https://cdn.modrinth.com/data/OnlVIpq5/6f2393cd87c37ef685efb82aacc5b0c9fae0c28d.png"

    content = "## " + displayName.get() + "\n" + changelog.get()
  }

  modrinth {
    accessToken = providers.environmentVariable("MODRINTH_TOKEN")
    projectId = "OnlVIpq5"

    minecraftVersionRange {
      start = project.min_mc_version
      end = project.max_mc_version

      includeSnapshots = true
    }

    announcementTitle = "Download from Modrinth"

    additionalFile(sourcesJar) {
      type = SOURCES_JAR
    }

    incompatible("moonrise-opt")
    incompatible("anti-xray")
    requires("zconfig")
  }

  curseforge {
    accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
    projectId = "1460602"
    
    minecraftVersionRange {
      start = project.min_mc_version
      end = project.max_mc_version
    }

    announcementTitle = "Download from Curseforge"

    javaVersions.add(JavaVersion.VERSION_21)

    projectSlug = "zfastnoise"

    client = true
    server = true

    additionalFile(sourcesJar) {
      name = "Sources Jar"
    }

    incompatible("moonrise")
    incompatible("antixray")
    incompatible("antixray-forge")
    requires("zconfig")
  }

  dryRun = providers.environmentVariable("MODRINTH_TOKEN").getOrNull() == null
}

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
  mods.from configurations.modImplementation
}
plugins {
  id 'me.champeau.jmh' version "${jmh_version}"
}

jmh {
  iterations = 4
  fork = 2
  timeOnIteration = '1s'

  jvmArgsAppend = ["-XX:+UnlockDiagnosticVMOptions", "-XX:CompileCommand=print,*WithinBoundsBenchmark.within*"]

  warmup = '2s'
  warmupIterations = 2

  // profilers = ['async']

  zip64 = true
  includes = ['NumberOfTrailingOnes']
}

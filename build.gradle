plugins {
  id 'org.relativitymc.neo-loom-remap' version "${loom_version}"
  id 'maven-publish'
  id 'me.champeau.jmh' version "${jmh_version}"
  id "com.modrinth.minotaur" version "${minotaur_version}"
  id "net.darkhax.curseforgegradle" version "${cf_gradle_version}"
}

version = project.mod_version + "+" + project.minecraft_version + "+forge"
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

repositories {
  // Add repositories to retrieve artifacts from in here.
  // You should only use this when depending on other mods because
  // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
  // See https://docs.gradle.org/current/userguide/declaring_repositories.html
  // for more information about repositories.
  maven { url = 'https://files.minecraftforge.net/maven/' }
}

loom {
  accessWidenerPath = file("src/main/resources/zfastnoise.ct")

  decompilerOptions.named("vineflower") {
    options.put("mark-corresponding-synthetics", "1")
  }

  runs {
    dap {
      vmArgs '-agentlib:jdwp=transport=dt_socket,server=y,address=5005'
      client()
    }

    hotswapDap {
      vmArgs '-agentlib:jdwp=transport=dt_socket,server=y,address=5005'
      vmArgs '-XX:+AllowEnhancedClassRedefinition'
      client()
    }
  }
}

remapJar {
  atAccessWideners.add("zfastnoise.ct")
}

// test {
//   useJUnitPlatform()
//   workingDir = mkdir(layout.buildDirectory.dir("testrun"))
// }

dependencies {
  // To change the versions see the gradle.properties file
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  forgeUserdev "net.minecraftforge:forge:$project.forge_version:userdev"
  mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
}

processResources {
  var replaceProperties = [
    minecraft_version      : min_minecraft_version,
    minecraft_version_range: minecraft_version_range,
    forge_version          : forge_version,
    mod_version            : mod_version,
  ]
  inputs.properties replaceProperties

  filesMatching(['META-INF/mods.toml']) {
    expand replaceProperties
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 17
}

java {
  // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
  // if it is present.
  // If you remove this line, sources will not be generated.
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

jar {
  inputs.property "archivesName", project.base.archivesName

  from("LICENSE") {
    rename { "${it}_${inputs.properties.archivesName}"}
  }
}

// configure the maven publication
publishing {
  publications {
    create("mavenJava", MavenPublication) {
      artifactId = project.archives_base_name
      from components.java
    }
  }

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    // Add repositories to publish to here.
    // Notice: This block does NOT have the same function as the block in the top level.
    // The repositories here will be used for publishing your artifact, not for
    // retrieving dependencies.
  }
}

jmh {
  iterations = 4
  fork = 2
  timeOnIteration = '1s'

  // jvmArgsAppend = ["-XX:+UnlockDiagnosticVMOptions","-XX:+LogCompilation","-XX:+PrintAssembly"]

  warmup = '2s'
  warmupIterations = 2

  profilers = ['async']

  zip64 = true
}

modrinth {
  token = System.getenv("MODRINTH_TOKEN")
  projectId = "zfastnoise"
  versionNumber = version
  versionType = project.hasProperty("zmtype") ? project.getProperty("zmtype") : "alpha"

  uploadFile = remapJar
  additionalFiles = [sourcesJar]

  changelog = file("changelog.md").exists() ? file("changelog.md").getText() : ""

  gameVersions = [project.minecraft_version,"1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6"]
  loaders = ["forge"]
  dependencies {
    incompatible.project "noisiumforked"
    incompatible.project "moonrise-opt"
    incompatible.project "anti-xray"
  }
}

task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
  dependsOn(remapJar)
  dependsOn(sourcesJar)

  apiToken = System.getenv("CURSEFORGE_TOKEN")
  def projectId = "1460602"

  def mainFile = upload(projectId, remapJar)

  mainFile.changelog = file("changelog.md").exists() ? file("changelog.md").getText() : ""
  mainFile.changelogType = "markdown"

  mainFile.releaseType = project.hasProperty("zmtype") ? project.getProperty("zmtype") : "alpha"
  mainFile.addModLoader("Forge")
  mainFile.addJavaVersion("Java 17")

  mainFile.addGameVersion("Client")
  mainFile.addGameVersion("Server")

  mainFile.addGameVersion(project.cf_mc_version)
  mainFile.addGameVersion("1.20.1")
  mainFile.addGameVersion("1.20.2")
  mainFile.addGameVersion("1.20.3")
  mainFile.addGameVersion("1.20.4")
  mainFile.addGameVersion("1.20.5")
  mainFile.addGameVersion("1.20.6")

  mainFile.withAdditionalFile(sourcesJar)
}

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
  mods.from configurations.modImplementation
}

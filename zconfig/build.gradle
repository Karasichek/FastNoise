plugins {
  id 'zfast.mod-publish'
}

version = project.mod_version + "+" + project.version_suffix
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

dependencies {
  include api("com.electronwill.night-config:toml:${project.night_config_version}")
  include api("com.electronwill.night-config:core:${project.night_config_version}")
}

processResources {
  inputs.property "version", project.version

  filesMatching("fabric.mod.json") {
    expand(inputs.properties)
  }
}

zmodPublish {
  name = "ZConfig"
  icon = "https://cdn.modrinth.com/data/4qmvXRB9/cbb824fe58645294ee7aa783bf49d5ef6c574142.png"
  mrId = "4qmvXRB9"
  cfId = "1632946"
  cfSlug = "zconfig"
}
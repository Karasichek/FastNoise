plugins {
  id 'zfast.mod-publish'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

loom {
  accessWidenerPath = file("src/main/resources/zfastsurface.ct")
}

dependencies {
  implementation project(path: ":zconfig", configuration: "namedElements")
}

processResources {
  inputs.property "version", project.version
  inputs.property "zconfig_version", project(":zconfig").version

  filesMatching("fabric.mod.json") {
    expand(inputs.properties)
  }
}

zmodPublish {
  name = "Fast Surface"
  icon = "https://cdn.modrinth.com/data/FRSaEVFk/c393b58d86fd5fc416158aaabf84210fa20d568c.png"
  mrId = "FRSaEVFk"
  cfId = "1672869"
  cfSlug = "zfastsurface"
}

publishMods {
  modrinth {
    incompatible("moonrise-opt")
    requires("zconfig")
  }

  curseforge {
    incompatible("moonrise")
    requires("zconfig")
  }
}
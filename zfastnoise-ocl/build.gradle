plugins {
  id 'zfast.version'
  id 'zfast.loom'
}

loom {
  accessWidenerPath = file("src/main/resources/zfastnoise-ocl.ct")
}

dependencies {
  implementation project(path: ":zfastnoise", configuration: "namedElements")
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 25
}

java {
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
}
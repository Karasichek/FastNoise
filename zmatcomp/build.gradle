plugins {
  id 'zfast.mod-publish'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

loom {
  accessWidenerPath = file("src/main/resources/zmatcomp.ct")
}

dependencies {
  implementation project(path: ":zconfig", configuration: "namedElements")

  if (project.hasProperty("zfastsurface")) {
    modImplementation project(":zfastsurface")
  }
}

processResources {
  inputs.property "version", project.version
  inputs.property "zconfig_version", project(":zconfig").version

  filesMatching("fabric.mod.json") {
    expand(inputs.properties)
  }
}

zmodPublish {
  name = "Material Rule Compiler"
  icon = "https://cdn.modrinth.com/data/vnpqfrJN/6963040cae639580f9505d32de8110143fce7db1.png"
  mrId = "vnpqfrJN"
  cfId = "1672783"
  cfSlug = "zmaterial-rule-compiler"
}

publishMods {
  modrinth {
    optional("zfastnoise")
    incompatible("moonrise-opt")
    requires("zconfig")
  }

  curseforge {
    optional("zfastnoise")
    incompatible("moonrise")
    requires("zconfig")
  }
}